name: PSB verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: psb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests_psb -v
      - run: node --check psb/static/chat.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests_browser/check_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psb-interface
          path: artifacts/
          if-no-files-found: ignore
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait
      - run: curl --fail http://127.0.0.1:8080/api/health
      - run: docker compose logs
        if: always()
      - run: docker compose down
        if: always()
